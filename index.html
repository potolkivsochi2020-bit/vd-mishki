<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наш волшебный день</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF0F6; --card:#FFFFFF; --ink:#5A1235; --soft:#9B5577; --line:#F4BCD6;
  --rose:#FF4F98; --rose2:#FFD6E8; --teal:#10AFA6; --teal2:#CFF5F1;
  --lilac:#8E6CF5; --lilac2:#ECE4FF; --gold:#F5A800; --gold2:#FFF0C4;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2A0F1E; --card:#3D1932; --ink:#FFE6F2; --soft:#EBB0CD; --line:#6A2E50;
    --rose2:#5E2444; --teal2:#14403C; --lilac2:#352A5E; --gold2:#4D3C10;
  }
}
:root[data-theme="dark"]{
  --bg:#2A0F1E; --card:#3D1932; --ink:#FFE6F2; --soft:#EBB0CD; --line:#6A2E50;
  --rose2:#5E2444; --teal2:#14403C; --lilac2:#352A5E; --gold2:#4D3C10;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Nunito",ui-rounded,"Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  font-size:18px;line-height:1.35}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}
button:disabled{cursor:default}
.wrap{max-width:900px;margin:0 auto;padding:18px 18px 48px}
.c-rose{--c:var(--rose);--c2:var(--rose2)} .c-teal{--c:var(--teal);--c2:var(--teal2)}
.c-lilac{--c:var(--lilac);--c2:var(--lilac2)} .c-gold{--c:var(--gold);--c2:var(--gold2)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin:0;font-weight:900;font-size:clamp(30px,6vw,46px);line-height:1;letter-spacing:-.5px}
.top h1 span{display:block;font-size:.42em;font-weight:800;color:var(--soft);letter-spacing:0;margin-top:6px}
.topbtns{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--line);
  border-radius:999px;padding:8px 14px;font-weight:900;font-size:18px;white-space:nowrap}
.pbtn{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:800;min-height:48px}

/* sticker board */
.board{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:14px 16px;margin-bottom:22px}
.board h2{margin:0 0 10px;font-size:20px;font-weight:900}
.slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:18px;background:var(--bg);display:grid;place-items:center;font-size:clamp(24px,5vw,38px);border:2px dashed var(--line)}
.slot.got{border:2px solid var(--gold);background:var(--gold2)}
.slot .no{filter:grayscale(1);opacity:.28}

/* day path */
.path{list-style:none;margin:0;padding:6px 0;
  background:radial-gradient(circle,var(--line) 3.5px,transparent 4.5px) center top/16px 24px repeat-y}
.stone{width:min(600px,88%);position:relative}
.stone+.stone{margin-top:16px}
.stone.l{margin-right:auto}.stone.r{margin-left:auto}
.stone>button{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);
  border:4px solid var(--c2);border-radius:38px;padding:10px 16px 10px 10px;min-height:96px}
.stone .em{flex:none;width:76px;height:76px;border-radius:50%;background:var(--c2);display:grid;place-items:center;font-size:42px}
.stone .tx{flex:1;min-width:0}
.stone .time{display:block;font-weight:900;color:var(--c);font-size:17px}
.stone .ti{display:block;font-weight:900;font-size:clamp(20px,3.6vw,25px);line-height:1.1}
.stone .who{display:block;color:var(--soft);font-weight:700;font-size:15px;margin-top:2px}
.stone .st{flex:none;font-size:30px;color:var(--line)}
.stone.done .em{box-shadow:0 0 0 5px var(--gold)}
.stone.done .st{color:var(--gold)}
.stone.now>button{border-color:var(--c);border-style:solid;box-shadow:0 8px 0 var(--c2)}
.nowtag{position:absolute;top:-12px;right:22px;background:var(--c);color:#fff;font-weight:900;font-size:14px;
  padding:3px 12px;border-radius:999px}
.stone.now .em{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* block screen */
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.navb{display:flex;gap:8px;flex-wrap:wrap}
.back{background:var(--card);border:3px solid var(--line);border-radius:999px;padding:10px 18px;font-weight:900;min-height:54px;font-size:18px}
.bar>.back,.bar>.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;box-sizing:border-box;height:56px;min-height:56px;width:164px;padding:0 12px;font-size:19px;font-weight:900;border:3px solid var(--line);border-radius:999px;background:var(--card);margin:0}
.hero{display:flex;align-items:center;gap:16px;background:var(--c2);border-radius:34px;padding:16px 18px;margin-bottom:18px;flex-wrap:wrap}
.bigem{font-size:72px;line-height:1}
.hero .meta{flex:1;min-width:180px}
.hero .time{margin:0;font-weight:900;color:var(--c);font-size:17px}
.hero h2{margin:2px 0 0;font-size:clamp(26px,5vw,38px);font-weight:900;line-height:1.05}
.speak{background:var(--card);border-radius:999px;padding:12px 18px;font-weight:900;min-height:56px;border:3px solid var(--c)}
.alisa{background:var(--card);border:3px dashed var(--lilac);border-radius:24px;padding:12px 16px;margin:22px 0 16px}
.alisa summary{font-weight:900;cursor:pointer;font-size:18px;min-height:32px}
.alisa p{margin:8px 0 2px;font-weight:700}
.finish{width:100%;min-height:76px;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:clamp(20px,3.5vw,26px);
  box-shadow:0 7px 0 color-mix(in srgb,var(--c) 60%,#000)}
.finish:disabled{background:var(--line);box-shadow:none;color:var(--soft)}
.finish:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 60%,#000)}
.hint{color:var(--soft);font-weight:700;margin:8px 2px}
.sub{background:var(--card);border-radius:30px;padding:16px;margin-top:18px;border:3px solid var(--c2)}
.sub h3{margin:0 0 4px;font-size:22px;font-weight:900}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;min-height:60px;border-radius:999px;background:var(--card);border:3px solid var(--c2);font-weight:900;font-size:19px}
.tab.on{background:var(--c);color:#fff;border-color:var(--c)}

/* checklist */
.checks{display:grid;gap:12px}
.chk{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--c2);border-radius:26px;padding:14px 16px;
  font-weight:800;font-size:clamp(19px,3.4vw,24px);text-align:left;min-height:76px}
.chk .box{flex:none;width:44px;height:44px;border-radius:14px;border:4px solid var(--c);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:900}
.chk.on{background:var(--c2)}
.chk.on .box{background:var(--c)}

/* exercises */
.exgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.exgrid{grid-template-columns:repeat(2,1fr)}}
.ex{position:relative;background:var(--card);border:4px solid var(--c2);border-radius:28px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:19px;min-height:150px}
.ex .exem{font-size:64px;line-height:1.1}
video.exem{width:100%;max-width:150px;aspect-ratio:1;border-radius:20px;object-fit:cover;background:#fff}
.mvid{width:min(340px,100%);aspect-ratio:1;border-radius:28px;object-fit:cover;background:#fff;display:block;margin:0 auto}
video.padm{width:96px;height:96px;border-radius:22px;object-fit:cover;background:#fff}
.ex.on{border-color:var(--gold);background:var(--gold2)}
.okb{position:absolute;top:6px;right:10px;font-size:26px}
.rhy{display:flex;gap:10px;justify-content:center;min-height:76px;align-items:center;flex-wrap:wrap;margin:10px 0}
.rhy span{width:66px;height:66px;border-radius:20px;background:var(--bg);display:grid;place-items:center;font-size:38px;border:3px solid var(--line);transition:transform .12s}
.rhy span.lit{transform:scale(1.18);border-color:var(--c);background:var(--c2)}
.rhy span.ok{border-color:var(--gold);background:var(--gold2)}
.rhybtns{display:flex;justify-content:center}
.rb{background:var(--c);color:#fff;border-radius:999px;padding:12px 26px;font-weight:900;min-height:58px;font-size:20px}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pad{min-height:130px;border-radius:32px;font-size:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}
.pad small{font-size:20px}
.pad.clap{background:var(--rose2)}.pad.stomp{background:var(--teal2)}
.pad:active{transform:scale(.95)}
.rmsg{text-align:center;font-weight:900;font-size:20px;margin:12px 0 0}

/* modal + celebration */
.modal,.cele,.stage{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;
  padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--ink) 55%,transparent)}
.mbox,.cbox{background:var(--card);border-radius:40px;padding:24px;width:min(520px,100%);text-align:center;border:5px solid var(--rose2)}
.mem{font-size:130px;line-height:1.1}
.bounce{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-14px)}}
.mbox h3,.cbox h3{margin:6px 0;font-size:30px;font-weight:900}
.mbox p{font-weight:700;font-size:20px;margin:6px 0 14px}
.dots{display:flex;justify-content:center;gap:10px;margin-bottom:16px}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--bg);border:3px solid var(--rose)}
.dots i.on{background:var(--rose)}
.count{width:100%;min-height:84px;border-radius:999px;background:var(--rose);color:#fff;font-weight:900;font-size:26px}
.close{margin-top:12px;font-weight:800;color:var(--soft);min-height:48px;padding:0 20px}
.stk{font-size:150px;line-height:1.1;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}to{transform:scale(1) rotate(0)}}
.cbox p{font-weight:800;font-size:20px;margin:4px 0 16px}
.cbox button{min-height:70px;width:100%;border-radius:999px;background:var(--rose);color:#fff;font-weight:900;font-size:24px}
.fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;background:transparent!important;border:0!important;border-radius:0!important}
.cbox{position:relative;overflow:hidden}
.cbox>*{position:relative;z-index:1}
.cbox>.rays,.cbox>.rainbow{position:absolute;z-index:0}
.rays{left:50%;top:110px;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--gold2) 0 12deg,transparent 12deg 24deg);animation:spin 9s linear infinite}
.rainbow{left:50%;top:40px;width:340px;height:170px;margin-left:-170px;border-radius:170px 170px 0 0;opacity:.85;transform-origin:50% 100%;
  background:radial-gradient(circle at 50% 100%,transparent 50%,#8E6CF5 50% 57%,#4DA3FF 57% 64%,#6BCB5B 64% 71%,#FFC23C 71% 78%,#FF7A3D 78% 85%,#FF4F98 85% 92%,transparent 92%);
  animation:arc .9s cubic-bezier(.2,1.4,.4,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes arc{from{transform:scale(0)}to{transform:scale(1)}}
.stk{filter:drop-shadow(0 8px 18px rgba(255,79,152,.45))}
.dance{display:flex;justify-content:center;gap:18px;font-size:46px;margin:-4px 0 4px}
.dance span{display:inline-block;animation:dance .55s ease-in-out infinite alternate}
.dance span:nth-child(2){animation-delay:.27s}
@keyframes dance{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-16px) rotate(10deg)}}
.conf{position:fixed;top:-60px;font-size:34px;pointer-events:none;animation:fall linear forwards;z-index:21}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}

/* lesson */
.letterbig{display:flex;align-items:center;gap:18px;justify-content:center;background:var(--card);border-radius:30px;padding:10px 16px;border:3px solid var(--c2);margin-bottom:14px}
.letterbig b{font-size:110px;line-height:1;color:var(--c);font-weight:900}
.letterbig button{background:var(--c2);border-radius:999px;padding:10px 18px;font-weight:900;min-height:56px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{aspect-ratio:1.25;border-radius:26px;background:var(--card);border:4px solid var(--c2);font-size:clamp(48px,10vw,76px);font-weight:900}
.tile.found{background:var(--c);color:#fff;border-color:var(--c)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.prog{text-align:center;font-weight:900;font-size:19px;margin:12px 0 0}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:var(--card);border-radius:30px;padding:18px;border:3px solid var(--c2);min-height:120px;align-items:center}
.items span{font-size:clamp(46px,9vw,64px)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.num{min-height:100px;border-radius:28px;background:var(--c2);font-size:56px;font-weight:900}
.lvl{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.lvl button{border-radius:999px;padding:8px 16px;border:3px solid var(--c2);font-weight:800;min-height:48px;background:var(--card)}
.lvl button.on{background:var(--c);color:#fff;border-color:var(--c)}

/* drawing */
.droww{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.big-btn{flex:1;min-width:200px;min-height:64px;border-radius:22px;border:0;font-weight:800;font-size:20px;color:#fff;font-family:inherit;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.big-btn.save{background:#FF4F98}.big-btn.newl{background:#10AFA6}
.galw{background:var(--card);border-radius:26px;padding:16px;margin-top:12px;border:3px solid var(--line)}
.galw h4{margin:0 0 12px;font-size:22px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.gi{position:relative}.gi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;border:3px solid var(--line);background:#fff;display:block;cursor:pointer}
.gdel{position:absolute;top:-8px;right:-8px;width:38px;height:38px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:16px;color:#c03}
.gempty{color:var(--soft);font-weight:700;margin:0}
.gvbox{background:#fff;border-radius:30px;padding:16px;max-width:94vw}
.gvbox img{display:block;max-width:100%;max-height:70vh;border-radius:20px;margin:0 auto}
#cv{width:100%;display:block;touch-action:none}
.askbox{text-align:center;max-width:520px}.askbox h3{margin:10px 6px 4px;font-size:24px}
.askimg{width:180px!important;height:180px;object-fit:cover;border-radius:18px;border:3px solid var(--line)}
.askov{z-index:40}
.gdel{width:52px!important;height:52px!important;top:-12px!important;right:-12px!important;font-size:22px!important;z-index:2;touch-action:manipulation}
.gdel::after{content:'';position:absolute;inset:-10px}
.today{display:flex;gap:12px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px;margin:10px 0}
.today .tbig{font-size:44px;line-height:1}
.today b{font-size:20px}
.today p{margin:2px 0 0;color:var(--soft);font-weight:700;font-size:16px}
.tool.off{opacity:.35}
.tool.zr{width:auto;padding:0 14px;font-size:20px;font-weight:900}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;align-items:center}
.sw{width:54px;height:54px;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 3px var(--line)}
.sw.on{box-shadow:0 0 0 5px var(--ink)}
.tool{width:58px;height:58px;border-radius:18px;background:var(--card);border:3px solid var(--line);font-size:28px}
.tool.on{border-color:var(--ink)}
canvas{display:block;width:100%;background:#fff;border-radius:28px;border:4px solid var(--c2);touch-action:none}

/* stem */
.stemcard{background:var(--card);border-radius:34px;border:4px solid var(--c2);padding:20px;text-align:center}
.stemcard .big{font-size:130px;line-height:1.1}
.stemcard h3{margin:4px 0 14px;font-size:30px;font-weight:900}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{min-height:110px;border-radius:30px;font-size:26px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ans span{font-size:46px}
.ans.fl{background:var(--teal2)}.ans.sk{background:var(--lilac2)}
.verdict{font-size:28px;font-weight:900;margin:6px 0}
.expl{font-weight:700;font-size:20px;margin:0 0 12px}
.next{min-height:70px;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:22px;padding:0 30px}

/* quiet */
.task{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--c2);border-radius:28px;padding:14px;flex-wrap:wrap}
.task+.task{margin-top:12px}
.task .tem{font-size:46px}
.task .tn{flex:1;min-width:150px;font-weight:900;font-size:21px}
.task .tt{font-variant-numeric:tabular-nums;font-weight:900;font-size:30px;color:var(--c)}
.task button{min-height:56px;border-radius:999px;padding:0 18px;font-weight:900;background:var(--c2)}
.task.done{background:var(--gold2);border-color:var(--gold)}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:.85;border-radius:22px;background:var(--c);font-size:clamp(40px,9vw,64px);color:#fff;font-weight:900}
.mc.open,.mc.match{background:var(--card);border:4px solid var(--c2)}
.mc.match{border-color:var(--gold);background:var(--gold2)}
.wcards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
@media (max-width:560px){.wcards{grid-template-columns:repeat(3,1fr)}}
.wc{background:var(--card);border:3px solid var(--c2);border-radius:24px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;min-height:140px;justify-content:center}
.wc .we{font-size:52px}
.wc b{font-size:22px}
.wc small{color:var(--soft);font-weight:700}
.quizq{display:flex;justify-content:center;margin:6px 0 12px}
.qopts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qo{min-height:120px;border-radius:28px;background:var(--c2);font-size:64px}

/* show */
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.chip{min-height:64px;border-radius:999px;padding:0 20px;background:var(--card);border:3px solid var(--c2);font-weight:900;font-size:21px}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.stage{background:radial-gradient(circle at 50% 30%,#FFE7A3 0,#FF7EB6 32%,#3B0D2A 75%);color:#fff;text-align:center}
.stage h3{font-size:clamp(34px,7vw,60px);margin:0 0 10px;font-weight:900}
.stage .sbtns{display:grid;gap:14px;width:min(420px,90vw);margin:20px auto 0}
.stage button{min-height:80px;border-radius:999px;background:#fff;color:var(--rose);font-weight:900;font-size:26px}
.stage .ghost{background:transparent;color:#fff;border:3px solid #fff;min-height:60px;font-size:20px}

/* summary */
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mood{min-height:96px;border-radius:26px;background:var(--card);border:3px solid var(--c2);font-size:56px}
.mood.on{background:var(--c2);border-color:var(--c)}
.bests{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.best{aspect-ratio:1;border-radius:20px;background:var(--card);border:3px solid var(--c2);font-size:clamp(28px,6vw,40px)}
.best.on{background:var(--c);border-color:var(--c)}

/* rules */
.vlist{display:grid;gap:8px}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:var(--card);border:3px solid var(--c2);border-radius:20px;padding:12px 16px;min-height:60px;font-weight:800}
.vrow.on{border-color:var(--c);background:var(--c2)}
.vtag{background:var(--gold2);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:14px;font-weight:900;white-space:nowrap}
.tipp{font-weight:700;margin:8px 0}
.rules{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.rules li{background:var(--card);border:3px solid var(--rose2);border-radius:24px;padding:14px 16px;font-weight:800;font-size:20px;display:flex;gap:12px;align-items:center}
.rules li span{font-size:36px}
.reset{margin-top:22px;min-height:56px;border-radius:999px;border:3px solid var(--line);padding:0 22px;font-weight:800;color:var(--soft);background:var(--card)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

function tone(f,d,type,delay){var c=ac();if(!c)return;var t=c.currentTime+(delay||0);var o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+(d||.18));o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+(d||.18)+.05)}

function MASTER(){var c=ac();if(MST)return MST;var g=c.createGain();g.gain.value=.55;var comp=c.createDynamicsCompressor();g.connect(comp);comp.connect(c.destination);
  try{var cv=c.createConvolver(),len=Math.floor(c.sampleRate*2.4),b=c.createBuffer(2,len,c.sampleRate);
    for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
    cv.buffer=b;var wet=c.createGain();wet.gain.value=.32;g.connect(cv);cv.connect(wet);wet.connect(comp)}catch(e){}
  MST=g;return g}
function mf(n){return 440*Math.pow(2,(n-69)/12)}
function note(f,t,d,kind,vol){var c=ac();if(!c)return;var T=c.currentTime+t,g=c.createGain();g.connect(MASTER());
  if(kind==='bell'){[1,2.01,3.98].forEach(function(m,i){var o=c.createOscillator(),gg=c.createGain();o.type='sine';o.frequency.value=f*m;
      gg.gain.setValueAtTime(.0001,T);gg.gain.exponentialRampToValueAtTime((vol||.15)/((i+1)*(i+1)),T+.01);gg.gain.exponentialRampToValueAtTime(.0001,T+d*1.6);
      o.connect(gg);gg.connect(g);o.start(T);o.stop(T+d*1.7)})}
  else if(kind==='pad'){var lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;lp.connect(g);

    g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol||.04,T+.15);g.gain.setValueAtTime(vol||.04,T+d);g.gain.exponentialRampToValueAtTime(.0001,T+d+.5)}

    g.gain.setValueAtTime(.0001,T);g.gain.exponentialRampToValueAtTime(vol||.15,T+.01);g.gain.exponentialRampToValueAtTime(.0001,T+d);o.start(T);o.stop(T+d+.05)}}
function fanfare(tr){tr=tr||0;var b=.28;
  function P(ns,t,d){ns.forEach(function(n){note(mf(n+tr),t,d,'pad',.035)})}
  function M(n,t,d){note(mf(n+tr),t,d||.35,'bell',.16);note(mf(n+tr),t,d||.35,'pluck',.06)}
  P([48,60,64,67],0,b*4);[67,72,76,79].forEach(function(n,i){M(n,i*b)});
  P([53,65,69,72],b*4,b*4);[81,79,77,76].forEach(function(n,i){M(n,b*4+i*b)});
  P([55,67,71,74],b*8,b*2);M(74,b*8);M(77,b*9);

function voicesFor(p){return voices.filter(function(x){return (x.lang||'').toLowerCase().replace('_','-').indexOf(p)===0})}
function pickVoice(p){var list=voicesFor(p);if(VP[p]){var w=list.filter(function(x){return x.name===VP[p]})[0];if(w)return w}
  return list.slice().sort(function(a,b){return vscore(b)-vscore(a)})[0]||null}
function speak(t,lang,keep){
  if(!('speechSynthesis' in window))return;
  try{
    if(!keep)speechSynthesis.cancel();

/* ---------- navigation ---------- */
var view={n:'home'},tick=null,stack=[];
function snap(){return {n:view.n,id:view.id,ut:U.tab,gt:GT,st:ST?{i:ST.i,ans:ST.ans}:null}}
function hpush(){try{history.pushState({k:Date.now()},'')}catch(e){}}
function step(){stack.push(snap());hpush()}
function ovPush(){hpush()}
function closeOv(){document.querySelectorAll('.modal,.cele,.stage').forEach(function(x){x.remove()})}
function setView(n,id,silent){view={n:n,id:id};if(tick){clearInterval(tick);tick=null}closeOv();render(silent);window.scrollTo(0,0)}
function go(n,id){step();setView(n,id)}
function goBack(){if(document.querySelector('.modal,.stage,.cele')||stack.length){try{history.back()}catch(e){popStep()}}else setView('home',null,true)}
function popStep(){
  if(document.querySelector('.modal,.stage,.cele')){closeOv();return}
  var s=stack.pop();if(!s){setView('home',null,true);return}
  U.tab=s.ut;GT=s.gt;if(s.st&&ST){ST.i=s.st.i;ST.ans=s.st.ans}
  setView(s.n,s.id,true)}
window.addEventListener('popstate',popStep);
function render(silent){if(view.n==='home')home();else if(view.n==='rules')rules();else if(view.n==='voice')voiceView();else block(view.id,silent)}
function navbar(){return '<div class="bar"><button class="back" data-a="home">🏰 Домой</button>'}

function dateText(){try{return new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})}catch(e){return ''}}

function home(){
  var now=nowMin(),cur=null;B.forEach(function(b){if(now>=mins(b.t)&&now<mins(b.e))cur=b});
  var h='<div class="wrap"><header class="top"><h1>Наш волшебный день<span>'+dateText()+'</span></h1>'+
   '<div class="topbtns"><span class="pill">⭐ '+cnt()+' из '+B.length+'</span><button class="pbtn" data-a="voice">🗣️ Голос</button><button class="pbtn" data-a="rules">🛡️ Правила</button></div></header>';
  h+='<section class="board"><h2>Наклейки дня</h2><div class="slots">'+B.map(function(b){
     return S.stars[b.id]?'<div class="slot got">'+STK[b.id]+'</div>':'<div class="slot"><span class="no">'+STK[b.id]+'</span></div>'}).join('')+'</div></section>';
  h+='<ol class="path">'+B.map(function(b,i){
    var isNow=cur&&cur.id===b.id;
    return '<li class="stone '+(i%2?'r':'l')+' c-'+b.col+(S.stars[b.id]?' done':'')+(isNow?' now':'')+'">'+
     (isNow?'<span class="nowtag">Сейчас</span>':'')+
     '<button data-a="open" data-v="'+b.id+'"><span class="em">'+b.em+'</span><span class="tx"><span class="time">'+b.t+'–'+b.e+'</span>'+
     '<span class="ti">'+b.ti+'</span><span class="who">'+b.who+'</span></span><span class="st">'+(S.stars[b.id]?'★':'☆')+'</span></button></li>'}).join('')+'</ol></div>';
  app.innerHTML=h;
}

function body(){return document.getElementById('body')}
function canFinish(b){
  var c=S.checks;
  switch(b.type){
    case 'check':return b.items.every(function(_,i){return c[b.id+i]});
    case 'zar':return EX.every(function(_,i){return c['zar'+i]});
    case 'urok':return !!(c.urokL&&c.urokC);
    case 'stem':return !!c.stemDone;
    case 'game':return !!(c.mem||c.eng);
    case 'show':return !!S.show&&SHOWI.every(function(_,i){return c['show'+i]});
    case 'itog':return S.mood!==null;
    default:return true;
  }
}

var Z={z:1,ox:0,oy:0},PAPER=null,UNDO=[];
function undoBtn(){var b=document.getElementById('undob');if(b)b.classList.toggle('off',!UNDO.length)}
function pushUndo(img){if(!img)return;UNDO.push(img);if(UNDO.length>12)UNDO.shift();undoBtn()}
function undoStep(){if(!PAPER||!UNDO.length)return;PAPER.x.putImageData(UNDO.pop(),0,0);PAPER.show();
  try{D.img=UNDO.length||!isBlank()?PAPER.c.toDataURL('image/png'):null}catch(_){}undoBtn();note(mf(76),0,.3,'bell',.1)}
function isBlank(){var d=PAPER.x.getImageData(0,0,PAPER.c.width,PAPER.c.height).data;for(var i=0;i<d.length;i+=16)if(d[i]<250||d[i+1]<250||d[i+2]<250)return false;return true}
function setupCv(){var cv=document.getElementById('cv');if(!cv)return;
  var w=cv.clientWidth,h=Math.round(Math.min(window.innerHeight*.72,w*1.0));
  var dpr=window.devicePixelRatio||1;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);cv.style.height=h+'px';
  var x=cv.getContext('2d'),pp=document.createElement('canvas');pp.width=cv.width;pp.height=cv.height;var px=pp.getContext('2d');
  px.setTransform(dpr,0,0,dpr,0,0);px.fillStyle='#fff';px.fillRect(0,0,w,h);px.lineCap='round';px.lineJoin='round';
  Z={z:1,ox:0,oy:0};UNDO=[];PAPER={c:pp,x:px,show:show};setTimeout(undoBtn,0);
  function show(){x.setTransform(1,0,0,1,0,0);x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);
    x.setTransform(dpr*Z.z,0,0,dpr*Z.z,dpr*Z.ox,dpr*Z.oy);x.drawImage(pp,0,0,w,h);
    var b=document.getElementById('zoomr');if(b)b.style.display=Z.z>1.02?'':'none'}
  if(D.img){var im=new Image();im.onload=function(){px.drawImage(im,0,0,w,h);show()};im.src=D.img}
  show();
  var P={},mode=null,last=null,snap=null,pin=null;
  function rel(e){var r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
  function toP(q){return [(q[0]-Z.ox)/Z.z,(q[1]-Z.oy)/Z.z]}
  function clampZ(){Z.ox=Math.min(0,Math.max(w-w*Z.z,Z.ox));Z.oy=Math.min(0,Math.max(h-h*Z.z,Z.oy))}
  function pinState(){var k=Object.keys(P),a=P[k[0]],b=P[k[1]];return {d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,m:[(a[0]+b[0])/2,(a[1]+b[1])/2]}}
  function seg(a,b){px.strokeStyle=D.c==='erase'?'#fff':D.c;px.lineWidth=[7,16,32][D.s]*(D.c==='erase'?1.6:1)/Z.z;
    px.beginPath();px.moveTo(a[0],a[1]);px.lineTo(b[0],b[1]);px.stroke();show()}
  cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    P[e.pointerId]=rel(e);var n=Object.keys(P).length;
    if(n===1&&mode!=='wait'){mode='draw';snap=null;try{snap=px.getImageData(0,0,pp.width,pp.height)}catch(_){}
      last=toP(P[e.pointerId]);seg(last,[last[0]+.1,last[1]+.1])}
    else if(n===2){if(mode==='draw'&&snap){px.putImageData(snap,0,0);show();snap=null}
      mode='pinch';var st=pinState();pin={d0:st.d,z0:Z.z,pt:toP(st.m)}}});
  cv.addEventListener('pointermove',function(e){if(!P[e.pointerId])return;P[e.pointerId]=rel(e);
    if(mode==='draw'){var q=toP(P[e.pointerId]);seg(last,q);last=q}
    else if(mode==='pinch'&&Object.keys(P).length>=2){var st=pinState();Z.z=Math.min(5,Math.max(1,pin.z0*st.d/pin.d0));
      Z.ox=st.m[0]-pin.pt[0]*Z.z;Z.oy=st.m[1]-pin.pt[1]*Z.z;clampZ();show()}});
  function up(e){if(!P[e.pointerId])return;delete P[e.pointerId];var n=Object.keys(P).length;
    if(mode==='draw'&&n===0){pushUndo(snap);snap=null;try{D.img=pp.toDataURL('image/png')}catch(_){}}
    if(mode==='pinch'&&n>0)mode='wait';
    if(n===0)mode=null}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
}

function dshuffle(arr,seed){var a=arr.slice(),x=(seed*7919)%233280;for(var i=a.length-1;i>0;i--){x=(x*9301+49297)%233280;var j=Math.floor(x/233280*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

R.stem=function(){if(!ST)newSt();var h;
  if(ST.i>=ST.order.length){
    h='<div class="stemcard"><div class="big">🏆</div><h3>Угадала '+ST.score+' из '+ST.order.length+'</h3>'+
     '<p class="expl">Теперь проверьте всё по-настоящему в миске с водой!</p><button class="next" data-a="stagain">Играть ещё раз</button></div>';
  }else{var it=ST.order[ST.i];
    h='<p class="prog" style="margin:0 0 10px">Предмет '+(ST.i+1)+' из '+ST.order.length+'</p><div class="stemcard"><div class="big">'+it[0]+'</div><h3>'+it[1]+'</h3>';
    if(ST.ans===null){h+='<div class="two"><button class="ans fl" data-a="sta" data-v="1"><span>🛟</span>Плавает</button><button class="ans sk" data-a="sta" data-v="0"><span>⬇️</span>Тонет</button></div>'}
    else{h+='<p class="verdict">'+(ST.ans?'Правильно! 🎉':'А вот и нет! 🙃')+'</p><p class="expl">'+it[3]+'</p><button class="next" data-a="stnext">Дальше</button>'}
    h+='</div>'}
  body().innerHTML=h};
function stAns(v){var it=ST.order[ST.i];ST.ans=(v===it[2]);if(ST.ans){ST.score++;yay()}else oops();
  speak((ST.ans?'Правильно! ':'А вот и нет! ')+it[3]);R.stem()}
function stNext(){ST.i++;ST.ans=null;if(ST.i>=ST.order.length&&!S.checks.stemDone){S.checks.stemDone=true;save();speak('Опыт закончен! Проверьте в миске с водой.')}
  else if(ST.i<ST.order.length)speak(ST.order[ST.i][1]+'. Тонет или плавает?');R.stem();upd()}

/* quiet time */
var QT=[['q1','📘','Английский',40],['q2','📖','Чтение или музыка',40]];
function qLeft(k,full){var t=S.tm[k];if(!t)return full*60;var l=t.left;if(t.run)l-= (Date.now()-t.run)/1000;return Math.max(0,Math.round(l))}
function fmt(s){var m=Math.floor(s/60),x=s%60;return m+':'+(x<10?'0':'')+x}
R.quiet=function(){
  body().innerHTML='<div class="task" style="background:var(--lilac2)"><span class="tem">😴</span><span class="tn">Миланка отдыхает или тихо слушает сказку</span></div>'+
   '<section class="sub"><h3>Время Алисы</h3><p class="hint">Нажми «Старт» и занимайся, телефон отложи. Таймер позвенит в конце.</p>'+
   QT.map(function(q){var l=qLeft(q[0],q[3]),done=S.checks[q[0]],run=S.tm[q[0]]&&S.tm[q[0]].run;
    return '<div class="task'+(done?' done':'')+'"><span class="tem">'+q[1]+'</span><span class="tn">'+q[2]+'</span>'+
     '<span class="tt" id="t-'+q[0]+'">'+(done?'✓':fmt(l))+'</span>'+(done?'':'<button data-a="qt" data-v="'+q[0]+'">'+(run?'⏸ Пауза':'▶️ Старт')+'</button>')+'</div>'}).join('')+
   '</section>';
  if(!tick)tick=setInterval(qTick,1000);
};
function qTick(){QT.forEach(function(q){var t=S.tm[q[0]];if(!t||!t.run||S.checks[q[0]])return;var l=qLeft(q[0],q[3]);
  var el=document.getElementById('t-'+q[0]);if(el)el.textContent=fmt(l);
  if(l<=0){S.checks[q[0]]=true;S.tm[q[0]]={left:0,run:null};save();yay();speak('Время вышло! Молодец, Алиса!');R.quiet();upd()}})}
function qToggle(k){var q=QT.filter(function(x){return x[0]===k})[0];var t=S.tm[k]||{left:q[3]*60,run:null};
  if(t.run){t.left=qLeft(k,q[3]);t.run=null}else{t.run=Date.now()}S.tm[k]=t;save();R.quiet()}

/* games */
var GT='mem',MEM=null,EQ=null;
function newMem(){var p=shuffle(['🦄','👑','🌈','🧁','🦋','🌸']);MEM={cards:shuffle(p.concat(p)).map(function(e){return {e:e,o:false,m:false}}),open:[],lock:false,moves:0,done:0}}
function newEq(){var w=TODAYW[rnd(5)],others=shuffle(TODAYW.filter(function(x){return x!==w})).slice(0,2);EQ={w:w,opts:shuffle([w].concat(others)),ok:EQ?EQ.ok:0}}
R.game=function(){
  var h='<div class="tabs"><button class="tab'+(GT==='mem'?' on':'')+'" data-a="gtab" data-v="mem">🃏 Найди пару'+(S.checks.mem?' ⭐':'')+'</button>'+
   '<button class="tab'+(GT==='eng'?' on':'')+'" data-a="gtab" data-v="eng">🇬🇧 Английский'+(S.checks.eng?' ⭐':'')+'</button></div>';
  if(GT==='mem'){if(!MEM)newMem();
    h+='<div class="mgrid">'+MEM.cards.map(function(c,i){return '<button class="mc'+(c.m?' match':c.o?' open':'')+'" data-a="mc" data-v="'+i+'">'+(c.o||c.m?c.e:'✨')+'</button>'}).join('')+'</div>'+
     '<p class="prog">'+(MEM.done===6?'Все пары найдены за '+MEM.moves+' ходов!':'Ходов: '+MEM.moves)+'</p>'+
     (MEM.done===6?'<p style="text-align:center"><button class="next" data-a="memagain">Играть ещё раз</button></p>':'');
  }else{if(!EQ)newEq();
    h+='<p class="hint">Слова дня. Нажми на карточку, чтобы услышать слово.</p><div class="wcards">'+TODAYW.map(function(w,i){
      return '<button class="wc" data-a="wsay" data-v="'+i+'"><span class="we">'+w[2]+'</span><b>'+w[0]+'</b><small>'+w[1]+'</small></button>'}).join('')+'</div>'+
     '<section class="sub"><h3>Угадай слово</h3><div class="quizq"><button class="rb" data-a="eqsay">🔊 Послушать слово</button></div>'+
     '<div class="qopts">'+EQ.opts.map(function(w){return '<button class="qo" data-a="eqa" data-v="'+w[0]+'">'+w[2]+'</button>'}).join('')+'</div>'+
     '<p class="prog">'+(S.checks.eng?'Все слова выучены! ⭐':'Угадано: '+EQ.ok+' из 5')+'</p></section>';
  }
  body().innerHTML=h};
function mcTap(i){var c=MEM.cards[i];if(MEM.lock||c.o||c.m)return;c.o=true;MEM.open.push(i);tone(520,.1,'triangle');
  if(MEM.open.length===2){MEM.moves++;var a=MEM.cards[MEM.open[0]],b=MEM.cards[MEM.open[1]];
    if(a.e===b.e){a.m=b.m=true;a.o=b.o=false;MEM.open=[];MEM.done++;setTimeout(yay,150);
      if(MEM.done===6){if(!S.checks.mem){S.checks.mem=true;save()}speak('Ура! Все пары найдены!')}}
    else{MEM.lock=true;setTimeout(function(){a.o=b.o=false;MEM.open=[];MEM.lock=false;R.game()},900)}}
  R.game();upd()}
function eqAns(w,el){if(w===EQ.w[0]){EQ.ok++;yay();speak('Правильно! '+EQ.w[1],'ru-RU');
    if(EQ.ok>=5&&!S.checks.eng){S.checks.eng=true;save()}newEq();setTimeout(function(){R.game();upd()},700)}
  else{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');oops();speak(EQ.w[0],'en-US')}}

/* show */
var SHOWT=[['🎵','Песня'],['💃','Танец'],['🎭','Спектакль'],['🪄','Фокус']];
var SHOWI=['💡 Придумали номер','👗 Нарядились','🔁 Отрепетировали три раза','📣 Готовы показать маме и папе'];
var DRAWT=[['🌈','Радугу','все цвета по порядку'],['🏠','Дом для единорожка','с окошками и дверью'],['🌊','Море и рыбок','волны и пузырьки'],['👨‍👩‍👧‍👧','Маму и папу','всю нашу семью'],['🌸','Цветочную полянку','много разных цветов'],['🦋','Бабочку','с узорами на крыльях'],['☀️','Солнышко и облака','яркий денёк'],['🐱','Любимого питомца','кошку, собаку или кого хочешь'],['🚀','Ракету и звёзды','полёт в космос'],['🏰','Замок принцессы','с башенками и флажками'],['🍎','Вкусный натюрморт','фрукты на столе'],['🎄','Праздник','ёлку, шарики и подарки'],['🦄','Единорожка','с розовой гривой'],['🌳','Большое дерево','с птичками на ветках']];
var DT=DRAWT[dayIdx()%DRAWT.length];
var SHOWIDEA=['Спеть любимую песенку и покружиться','Станцевать танец маленьких единорожков','Показать спектакль про принцессу и дракончика','Сделать фокус: спрятать игрушку и найти её','Рассказать стишок с движениями','Станцевать танец снежинок','Спеть песенку про дружбу','Показать цирк: пройти по «канату» на полу'];
var SIDEA=SHOWIDEA[dayIdx()%SHOWIDEA.length];
function sayOf(b){
  if(b.type==='draw')return 'Рисуем! Тема дня: '+DT[1]+', '+DT[2]+'. Выбери цвет и рисуй пальчиком. А можно нарисовать что хочешь!';
  if(b.type==='show')return 'Готовим шоу для мамы и папы! Идея на сегодня: '+SIDEA+'. Или придумайте своё!';
  return b.say}
R.show=function(){
  body().innerHTML='<div class="today"><span class="tbig">✨</span><div><b>Идея на сегодня</b><p>'+SIDEA+'. Или придумайте своё!</p></div></div><div class="chips">'+SHOWT.map(function(s){return '<button class="chip'+(S.show===s[1]?' on':'')+'" data-a="shw" data-v="'+s[1]+'">'+s[0]+' '+s[1]+'</button>'}).join('')+'</div>'+
   '<div class="checks">'+SHOWI.map(function(it,i){var k='show'+i;
    return '<button class="chk'+(S.checks[k]?' on':'')+'" data-a="shchk" data-v="'+i+'"><span class="box">'+(S.checks[k]?'✓':'')+'</span><span>'+it+'</span></button>'}).join('')+'</div>'+
   '<p style="text-align:center;margin-top:16px"><button class="next" data-a="stage">🎬 Открыть сцену</button></p>'};
function stage(){var o=document.createElement('div');o.className='stage';
  o.innerHTML='<div><div class="stk">🌟</div><h3>Встречайте! '+(S.show||'Наше шоу')+'!</h3><div class="sbtns"><button data-a="clapp">👏 Аплодисменты</button><button class="ghost" data-a="mclose">Закрыть сцену</button></div></div>';
  document.body.appendChild(o);ovPush();speak('Встречайте! Начинаем шоу!');applause()}

/* summary */
var MOODS=['😄','🙂','😐','😢'];
R.itog=function(){
  body().innerHTML='<section class="sub" style="margin-top:0"><h3>Какое настроение?</h3><div class="moods">'+MOODS.map(function(m,i){
     return '<button class="mood'+(S.mood===i?' on':'')+'" data-a="mood" data-v="'+i+'">'+m+'</button>'}).join('')+'</div></section>'+
   '<section class="sub"><h3>Что понравилось больше всего?</h3><div class="bests">'+B.filter(function(b){return b.id!=='itog'}).map(function(b){
     return '<button class="best'+(S.best===b.id?' on':'')+'" data-a="best" data-v="'+b.id+'" aria-label="'+b.ti+'">'+b.em+'</button>'}).join('')+'</div>'+
   (S.best?'<p class="hint">Расскажите маме и папе: «'+blk(S.best).ti+'»</p>':'')+'</section>'+
   '<section class="sub"><h3>Наклейки дня: '+cnt()+' из '+B.length+'</h3><div class="slots">'+B.map(function(b){
     return S.stars[b.id]?'<div class="slot got">'+STK[b.id]+'</div>':'<div class="slot"><span class="no">'+STK[b.id]+'</span></div>'}).join('')+'</div></section>'};

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.clientX||e.clientY){LX=e.clientX;LY=e.clientY}
  var t=e.target.closest('[data-a]');if(!t)return;ac();
  var a=t.dataset.a,v=t.dataset.v;
  switch(a){
    case 'home':go('home');break;
    case 'back':goBack();break;
    case 'voice':go('voice');break;
    case 'vsel':{var pv=v.split('|'),vv=VSORT[pv[0]][+pv[1]];if(vv){VP[pv[0]]=vv.name;saveVP();voiceView();
      speak(pv[0]==='en'?'Hello! Let us learn new words.':'Привет! Я буду рассказывать вам, что делать.',pv[0]==='en'?'en-US':'ru-RU')}break}
    case 'vrate':VP.rate=+v;saveVP();voiceView();speak('Вот так я буду говорить.');break;
    case 'vtest':speak('Доброе утро, девочки! Сегодня нас ждёт волшебный день.');break;
    case 'rules':go('rules');speak('Правила безопасности');break;
    case 'sayrules':speak(RULES.map(function(r){return r[1]}).join('. '));break;
    case 'reset':askYes('Стереть все звёздочки за сегодня?','🗑️ Стереть',function(){S=fresh();save();go('home')});break;
    case 'open':go('block',v);break;
    case 'say':if(cur)speak(sayOf(cur));break;
    case 'finish':if(cur&&canFinish(cur)&&!S.stars[cur.id]){S.stars[cur.id]=true;save();upd();celebrate(cur.id)}break;
    case 'chk':{var k=cur.id+v;S.checks[k]=!S.checks[k];save();if(S.checks[k]){ding();speak(cur.items[+v].split(' ').slice(1).join(' '))}R.check(cur);upd();break}
    case 'ex':exModal(+v);break;
    case 'cnt':exCount();break;
    case 'mclose':goBack();break;
    case 'rplay':playPat();break;
    case 'rin':rin(v);break;
    case 'utab':if(U.tab===v)break;step();U.tab=v;R.urok();if(v==='let')speak('Буква '+LETTER+'. Найди все буквы '+LETTER);else speak('Сосчитай картинки и нажми на правильную цифру');break;
    case 'sayl':speak('Буква '+LETTER);break;
    case 'tile':tileTap(+v,t);break;
    case 'lvl':U.lvl=+v;U.cnt=null;R.urok();break;
    case 'num':numTap(+v,t);break;
    case 'col':D.c=v;document.querySelectorAll('.sw,.tool[data-a=col]').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});break;
    case 'size':D.s=(D.s+1)%3;t.textContent=['•','●','⬤'][D.s];break;
    case 'clr':if(!D.img){clearCv();break}askYes('Стереть рисунок?','🗑️ Стереть',function(){D.img=null;clearCv()});break;
    case 'savedraw':{var cv=document.getElementById('cv');if(!cv||!D.img){speak('Сначала нарисуй что-нибудь!');break}
      var W=640,H=Math.round(W*cv.height/cv.width),tc=document.createElement('canvas');tc.width=W;tc.height=H;var tx=tc.getContext('2d');
      tx.fillStyle='#fff';tx.fillRect(0,0,W,H);tx.drawImage(PAPER?PAPER.c:cv,0,0,W,H);var g=loadGal();g.push(tc.toDataURL('image/jpeg',.82));
      if(saveGal(g)){D.img=null;R.draw();yay();speak('Ура! Рисунок в галерее!')}else{askYes('Галерея переполнена. Удали пару старых рисунков крестиком и сохрани снова.','Понятно',function(){})}
      break}
    case 'newdraw':if(!D.img){clearCv();ding();break}askYes('Начать новый лист? Этот рисунок не сохранён и пропадёт.','📄 Новый лист',function(){D.img=null;clearCv();ding()});break;
    case 'deldraw':{var dv=+v;askYes('Удалить этот рисунок из галереи?','✖ Удалить',function(){var g2=loadGal();g2.splice(dv,1);saveGal(g2);R.draw()},loadGal()[dv]);break}
    case 'viewdraw':{var g3=loadGal();if(!g3[+v])break;var ov=document.createElement('div');ov.className='cele gview';
      ov.innerHTML='<div class="gvbox"><img src="'+g3[+v]+'"><div class="droww"><button class="big-btn save" data-a="gedit" data-v="'+v+'">✏️ Дорисовать</button><button class="big-btn newl" data-a="gclose">Закрыть</button></div></div>';
      document.body.appendChild(ov);break}
    case 'askyes':{var cb=ASKCB;ASKCB=null;closeAsk();if(cb)cb();break}
    case 'askno':closeAsk();break;
    case 'undo':undoStep();break;
    case 'zoomr':zoomReset();break;
    case 'gclose':document.querySelectorAll('.gview').forEach(function(o){o.remove()});break;
    case 'gedit':{var g4=loadGal();document.querySelectorAll('.gview').forEach(function(o){o.remove()});if(g4[+v]){D.img=g4[+v];R.draw();window.scrollTo(0,0)}break}
    case 'sta':stAns(+v);break;
    case 'stnext':step();stNext();break;
    case 'stagain':step();newSt();R.stem();speak(ST.order[0][1]+'. Тонет или плавает?');break;
    case 'qt':qToggle(v);break;
    case 'gtab':if(GT===v)break;step();GT=v;R.game();speak(v==='mem'?'Найди одинаковые картинки':'Английские слова дня');break;
    case 'mc':mcTap(+v);break;
    case 'memagain':newMem();R.game();break;
    case 'wsay':{var w=TODAYW[+v];speak(w[0],'en-US');speak(w[1],'ru-RU',true);break}
    case 'eqsay':speak(EQ.w[0],'en-US');break;
    case 'eqa':eqAns(v,t);break;
    case 'shw':S.show=v;save();R.show();upd();speak(v+'!');break;
    case 'shchk':{var sk='show'+v;S.checks[sk]=!S.checks[sk];save();if(S.checks[sk])ding();R.show();upd();break}
    case 'stage':stage();break;
    case 'clapp':applause();break;
    case 'mood':S.mood=+v;save();R.itog();upd();speak(['Отличное настроение!','Хорошее настроение!','Обычное настроение.','Грустно? Обнимитесь!'][+v]);break;
    case 'best':S.best=v;save();R.itog();speak(blk(v).ti);break;
  }
});
window.addEventListener('resize',function(){if(view.n==='block'&&cur&&cur.type==='draw'){var c=document.getElementById('cv');if(c&&Math.abs(c.width/(window.devicePixelRatio||1)-c.clientWidth)>20)R.draw()}});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.date!==todayKey()){S=fresh();save();go('home')}});
render();
})();
</script>
</body>
</html>
